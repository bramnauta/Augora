# Example deployment on a Linux host, without host networking.
#
# The container gets its own address in your LAN through macvlan, so mDNS discovery finds the
# Google Cast devices and speakers can reach the stream endpoint directly on port 4727. Set the
# values in a .env file next to this one (see .env.example).
#
# macvlan isolates the container from the host itself: a reverse proxy on the same host reaches
# Augora through the "proxy" bridge network below instead (attach your proxy container to it).
services:
  augora:
    build: .
    image: augora:latest
    container_name: augora
    restart: unless-stopped
    networks:
      lan:
        ipv4_address: ${AUGORA_IP}
      proxy: {}
    volumes:
      - augora-data:/data
      # Music library, e.g. a NAS share mounted on the host. Read-only is enough.
      - ${MUSIC_PATH:-/mnt/nas/music}:/music:ro
    environment:
      TZ: Europe/Amsterdam
      # With two networks the LAN address cannot be detected reliably: always the macvlan address.
      Augora__StreamBaseUrl: http://${AUGORA_IP}:4727
      # Public url when running behind a reverse proxy.
      Augora__PublicBaseUrl: ${PUBLIC_URL:-}
      Providers__LocalFiles__Folders__0__Name: Muziek
      Providers__LocalFiles__Folders__0__Path: /music
      # Client id of your app on developer.spotify.com (accounts can also bring their own).
      Providers__Spotify__ClientId: ${SPOTIFY_CLIENT_ID:-}
      Augora__LastFmApiKey: ${LASTFM_API_KEY:-}

networks:
  lan:
    driver: macvlan
    driver_opts:
      # The host's network interface on the LAN, e.g. eth0, or eth0.20 for a VLAN.
      parent: ${LAN_PARENT:-eth0}
    ipam:
      config:
        - subnet: ${LAN_SUBNET}
          gateway: ${LAN_GATEWAY}
          # Keep this range out of your DHCP pool.
          ip_range: ${LAN_IP_RANGE:-${AUGORA_IP}/32}
  proxy:
    driver: bridge

volumes:
  augora-data:
